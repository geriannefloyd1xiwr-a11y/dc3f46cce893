version: 2.1

jobs:
  snp-call:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Restore vendored sources
          command: tar xzf egg.tgz
      - run:
          name: Provision build deps
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Write pileup
          command: |
            printf 'chr1 100 A\n' > pileup.txt
      - run:
          name: Build variant caller
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target snp-call -j2
      - run:
          name: Call SNPs
          command: LIONSS_LP=1 ./build/snp-call --pileup pileup.txt --minq 20
  lodestar:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Fetch fixtures
          command: tar xzf egg.tgz
      - run:
          name: Install prerequisites
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Load sky map
          command: |
            printf 'declination 89\n' > lode.cfg
      - run:
          name: Build celestial nav
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target lodestar -j2
      - run:
          name: Fix on lodestar
          command: LIONSS_LP=1 ./build/lodestar --config lode.cfg --refraction
  groundTrack:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Sync asset bundles
          command: tar xzf egg.tgz
      - run:
          name: Provision compiler
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Load orbit
          command: |
            printf 'inc 51.6\n' > gt.cfg
      - run:
          name: Build geometry engine
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target groundTrack -j2
      - run:
          name: Compute ground track
          command: LIONSS_LP=1 ./build/groundTrack --conf gt.cfg --passes 3
  spill-tempfile:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Unpack toolkit
          command: tar xzf egg.tgz
      - run:
          name: Install toolchain
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Size spill
          command: |
            printf 'mem 64m\n' > spill.cfg
      - run:
          name: Build sort operator
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target spill-tempfile -j2
      - run:
          name: Spill to tempfile
          command: LIONSS_LP=1 ./build/spill-tempfile --conf spill.cfg --rows 5000000
  pic_leapfrog:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Hydrate workspace
          command: tar xzf egg.tgz
      - run:
          name: Bootstrap toolchain
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Init grid
          command: |
            printf 'nx 128\n' > pic.in
      - run:
          name: Build PIC solver
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target pic_leapfrog -j2
      - run:
          name: Advance leapfrog step
          command: LIONSS_LP=1 ./build/pic_leapfrog --in pic.in --dt 0.01
  k8s-drain:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Extract sources
          command: tar xzf egg.tgz
      - run:
          name: Prepare build environment
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: List node pods
          command: |
            printf 'pod-a\npod-b\n' > pods.txt
      - run:
          name: Build node controller
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target k8s-drain -j2
      - run:
          name: Drain node gracefully
          command: LIONSS_LP=1 ./build/k8s-drain --pods pods.txt --grace 30
  ZkSetup:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
